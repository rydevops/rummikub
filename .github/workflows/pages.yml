name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/rules.test.js
      - run: node tests/sim.js 40

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        run: echo "self.APP_VERSION = '$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}';" > version.js
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css version.js rules.js ai.js app.js sw.js manifest.webmanifest _site/
          cp -r icons _site/icons
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
